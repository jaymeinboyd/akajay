<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>akaJay — Kitchen gallery beta</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{
  --wall:#f2f0eb;--wall2:#e7e5df;--cab:#e9e9e5;--cab2:#d0d2cf;--counter:#d9d8d2;
  --wood:#bda47e;--metal:#292d2e;--accent:#202426;--floor1:#b7aa98;--floor2:#8f8373;
  --frame:#202223;--mat:#f7f3ea;--plate:#f1f0eb;--switch:#f8f8f5;
}
body[data-style="airy"]{
  --wall:#fbfaf6;--wall2:#eef2f0;--cab:#fbfbf7;--cab2:#e7e8e4;--counter:#f3f1eb;
  --wood:#d7c4a2;--metal:#a9afb0;--accent:#c6d8d4;--floor1:#d8cab5;--floor2:#c2b29b;
  --frame:#b89b70;--mat:#fffefa;--plate:#fcfbf7;--switch:#fff;
}
body[data-style="farmhouse"]{
  --wall:#eee7d8;--wall2:#e3ddcf;--cab:#768777;--cab2:#5d6e60;--counter:#b88b5e;
  --wood:#9c7048;--metal:#353735;--accent:#6c806f;--floor1:#92785e;--floor2:#6e5845;
  --frame:#5a4030;--mat:#f3eadb;--plate:#e6dfd1;--switch:#f3ede3;
}
body[data-style="traditional"]{
  --wall:#e8dfd0;--wall2:#d7cbb8;--cab:#6a442c;--cab2:#4d2f20;--counter:#c6b59f;
  --wood:#7f5638;--metal:#8a693a;--accent:#aa864d;--floor1:#805d43;--floor2:#594130;
  --frame:#6f4b31;--mat:#efe4d3;--plate:#d8c9b2;--switch:#eee5d8;
}
body[data-style="rustic"]{
  --wall:#a7a093;--wall2:#817b71;--cab:#5e4939;--cab2:#3f3027;--counter:#8d8070;
  --wood:#70513b;--metal:#242626;--accent:#5d584f;--floor1:#644a37;--floor2:#463426;
  --frame:#35291f;--mat:#e7ddce;--plate:#c6b9a6;--switch:#ddd2c3;
}
a{color:inherit}
.room-shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111}
.scene{
  position:absolute;inset:0;
  overflow:hidden;
  background:linear-gradient(180deg,var(--wall) 0 56%,var(--floor1) 56% 100%);
  transition:background .7s ease;
}
.scene::before{
  content:"";position:absolute;left:0;right:0;top:0;height:56%;
  background:
    radial-gradient(ellipse 45% 55% at 22% 3%,rgba(255,255,255,.68),transparent 68%),
    linear-gradient(115deg,transparent 0 52%,rgba(255,255,255,.18) 64%,transparent 76%);
  pointer-events:none;z-index:1;
}
body[data-style="farmhouse"] .scene::after{
  content:"";position:absolute;inset:0 0 44%;
  background:repeating-linear-gradient(180deg,transparent 0 28px,rgba(90,76,60,.13) 29px 31px);
  pointer-events:none;
}
body[data-style="rustic"] .scene::after{
  content:"";position:absolute;inset:0 0 44%;
  background:
    radial-gradient(circle at 12% 20%,rgba(255,255,255,.08) 0 7%,transparent 7.5%),
    radial-gradient(circle at 41% 66%,rgba(0,0,0,.08) 0 8%,transparent 8.5%),
    radial-gradient(circle at 80% 33%,rgba(255,255,255,.07) 0 6%,transparent 6.5%);
  background-size:150px 110px,190px 130px,170px 120px;
  opacity:.75;pointer-events:none;
}
.ceiling{position:absolute;left:0;right:0;top:0;height:8%;background:linear-gradient(180deg,#faf9f5,rgba(255,255,255,.5));box-shadow:0 8px 26px rgba(0,0,0,.08);z-index:2}
.wall{position:absolute;left:0;right:0;top:8%;height:48%;background:linear-gradient(180deg,var(--wall),var(--wall2));transition:background .7s ease}
.floor{position:absolute;left:0;right:0;bottom:0;height:44%;
  background:
    repeating-linear-gradient(94deg,rgba(255,255,255,.055) 0 2px,transparent 2px 78px),
    linear-gradient(180deg,var(--floor1),var(--floor2));
  transition:background .7s ease;
}
.back-counter{position:absolute;left:4%;right:4%;top:51%;height:5%;background:linear-gradient(180deg,var(--counter),rgba(80,72,65,.45));box-shadow:0 5px 10px rgba(0,0,0,.25);z-index:5}
.lower-cabinets{position:absolute;left:5%;right:5%;top:56%;height:23%;display:grid;grid-template-columns:repeat(8,1fr);z-index:4}
.lower-cabinets span{border:1px solid rgba(30,28,25,.28);background:linear-gradient(90deg,var(--cab),var(--cab2));transition:background .7s ease;position:relative}
.lower-cabinets span::after{content:"";position:absolute;top:11px;left:50%;width:36%;height:4px;border-radius:3px;background:var(--metal);opacity:.75}
.window{position:absolute;right:8%;top:13%;width:28%;height:31%;border:12px solid #f7f4ec;box-shadow:0 8px 18px rgba(0,0,0,.14);z-index:3;background:
  linear-gradient(90deg,transparent 49%,rgba(255,255,255,.9) 49% 51%,transparent 51%),
  linear-gradient(180deg,transparent 49%,rgba(255,255,255,.9) 49% 51%,transparent 51%),
  linear-gradient(180deg,#c6d9df,#eff5f3 62%,#c8d2bb 63% 100%);
}
body[data-style="modern"] .window{border-color:#f5f5f2}
body[data-style="traditional"] .window{border-color:#7f5d43}
body[data-style="rustic"] .window{border-color:#5a4433}
.upper{position:absolute;right:39%;top:14%;width:14%;height:30%;display:grid;grid-template-columns:1fr 1fr;z-index:3}
.upper span{border:1px solid rgba(30,28,25,.2);background:linear-gradient(90deg,var(--cab),var(--cab2));position:relative}
.upper span::after{content:"";position:absolute;right:8px;top:50%;width:4px;height:18%;background:var(--metal);border-radius:3px}
body[data-style="modern"] .upper span{border-radius:0;background:linear-gradient(90deg,#efefeb,#d8d9d5)}
body[data-style="farmhouse"] .upper span::before,body[data-style="traditional"] .upper span::before{
  content:"";position:absolute;inset:12px;border:2px solid rgba(255,255,255,.17);
}
.sink{position:absolute;right:13%;top:49.5%;width:18%;height:4%;border-radius:0 0 50% 50%;background:#d8d8d3;z-index:7;box-shadow:inset 0 3px 5px rgba(0,0,0,.25)}
.faucet{position:absolute;right:20.8%;top:43%;width:3.5%;height:8%;border:7px solid var(--metal);border-bottom:0;border-radius:40px 40px 0 0;z-index:6}
.island{position:absolute;left:31%;bottom:3%;width:38%;height:27%;z-index:9;filter:drop-shadow(0 18px 18px rgba(0,0,0,.28))}
.island-top{position:absolute;left:-4%;right:-4%;top:0;height:12%;background:linear-gradient(180deg,var(--counter),#aaa49a);box-shadow:0 3px 7px rgba(0,0,0,.25)}
.island-base{position:absolute;left:0;right:0;top:12%;bottom:0;background:linear-gradient(90deg,var(--accent),var(--cab2));border:1px solid rgba(0,0,0,.28)}
.island-base::before,.island-base::after{content:"";position:absolute;top:12%;bottom:12%;width:28%;border:2px solid rgba(255,255,255,.12)}
.island-base::before{left:10%}.island-base::after{right:10%}
.pendant{position:absolute;top:0;width:2px;height:18%;background:#444;z-index:8}
.pendant::after{content:"";position:absolute;left:50%;bottom:-18px;width:56px;height:36px;transform:translateX(-50%);border-radius:50% 50% 38% 38%;background:linear-gradient(180deg,#2e3132,#737878 55%,#eee 58% 64%,#343738);box-shadow:0 10px 20px rgba(255,241,194,.22)}
.p1{left:39%}.p2{left:58%}
.frames{position:absolute;left:6%;top:15%;width:52%;height:31%;z-index:10}
.frame{
  position:absolute;display:block;text-decoration:none;
  padding:8px;background:linear-gradient(145deg,var(--frame),#555);
  box-shadow:0 8px 18px rgba(0,0,0,.27),inset 0 0 0 1px rgba(255,255,255,.14);
  transition:transform .18s ease,box-shadow .18s ease,background .7s ease;
}
.frame:hover,.frame:focus-visible{transform:translateY(-3px) scale(1.015);box-shadow:0 14px 26px rgba(0,0,0,.34);outline:none}
.frame:nth-child(1){left:1%;top:19%;width:24%;aspect-ratio:1.18}
.frame:nth-child(2){left:29%;top:2%;width:29%;aspect-ratio:1.18}
.frame:nth-child(3){left:62%;top:22%;width:23%;aspect-ratio:1.18}
.mat{display:block;width:100%;height:100%;padding:7%;background:var(--mat);transition:background .7s ease}
.art{display:block;width:100%;height:100%;background-image:url("../assets/art-sprite.png");background-repeat:no-repeat;background-color:#fff;transition:opacity .35s ease}
.frame.changing .art{opacity:0}
.switch-plate{
  position:absolute;right:4.3%;top:45%;z-index:18;
  width:228px;height:72px;border-radius:7px;padding:9px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:7px;
  background:linear-gradient(145deg,var(--plate),#bdbdb8);
  border:1px solid rgba(55,52,48,.48);
  box-shadow:0 8px 15px rgba(0,0,0,.22),inset 1px 1px rgba(255,255,255,.7);
  transition:background .7s ease;
}
.switch-plate::before,.switch-plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#777 45%,#333);transform:translateY(-50%)}
.switch-plate::before{left:5px}.switch-plate::after{right:5px}
.switch{
  position:relative;width:34px;height:50px;padding:0;border:0;background:transparent;cursor:pointer;
}
.rocker{
  position:absolute;left:6px;right:6px;top:5px;bottom:5px;border-radius:3px;
  background:linear-gradient(180deg,#fff,var(--switch));
  border:1px solid rgba(40,40,36,.3);
  box-shadow:inset 0 -7px 8px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.3);
  transform:perspective(80px) rotateX(-8deg);
  transform-origin:center;
  transition:transform .2s ease,box-shadow .2s ease,background .7s ease;
}
.switch.active .rocker{
  transform:perspective(80px) rotateX(12deg) translateY(-2px);
  box-shadow:inset 0 8px 8px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.2);
}
.switch::after{
  content:attr(data-label);
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(5px);
  white-space:nowrap;padding:6px 9px;border-radius:4px;
  color:#f5f0e8;background:rgba(26,27,27,.9);
  font-size:.72rem;letter-spacing:.04em;
  opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  box-shadow:0 5px 12px rgba(0,0,0,.3);
}
.switch:hover::after,.switch:focus-visible::after,.switch.show-label::after{opacity:1;transform:translateX(-50%) translateY(0)}
.switch:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}
.back{
  position:fixed;left:18px;top:16px;z-index:30;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;color:#eee;font-size:1.35rem;
  border:1px solid rgba(255,255,255,.35);background:rgba(20,22,23,.52);backdrop-filter:blur(8px)
}
@media(max-width:760px){
  .switch-plate{right:50%;transform:translateX(50%);top:auto;bottom:14px;width:214px}
  .frames{left:5%;width:63%;top:17%}
  .frame:nth-child(1){width:29%}.frame:nth-child(2){width:34%;left:33%}.frame:nth-child(3){width:28%;left:70%}
  .window{right:5%;width:27%}.upper{display:none}
  .island{left:18%;width:64%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-style="modern">
<a class="back" href="../" aria-label="Back to room entrance">←</a>
<main class="room-shell" aria-label="Kitchen gallery">
  <div class="scene" aria-hidden="true">
    <div class="ceiling"></div><div class="wall"></div><div class="floor"></div>
    <div class="window"></div>
    <div class="upper"><span></span><span></span></div>
    <div class="back-counter"></div>
    <div class="lower-cabinets"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="sink"></div><div class="faucet"></div>
    <div class="pendant p1"></div><div class="pendant p2"></div>
    <div class="island"><div class="island-top"></div><div class="island-base"></div></div>
  </div>

  <div class="frames" aria-label="Available art">
    <a class="frame" data-slot="0" target="_blank" rel="noopener"><span class="mat"><span class="art"></span></span></a>
    <a class="frame" data-slot="1" target="_blank" rel="noopener"><span class="mat"><span class="art"></span></span></a>
    <a class="frame" data-slot="2" target="_blank" rel="noopener"><span class="mat"><span class="art"></span></span></a>
  </div>

  <div class="switch-plate" role="group" aria-label="Kitchen style">
    <button class="switch" data-style="airy" data-label="Bright & Airy" aria-label="Bright and Airy kitchen"><span class="rocker"></span></button>
    <button class="switch" data-style="farmhouse" data-label="Cozy Farmhouse" aria-label="Cozy Farmhouse kitchen"><span class="rocker"></span></button>
    <button class="switch" data-style="traditional" data-label="Classic Traditional" aria-label="Classic Traditional kitchen"><span class="rocker"></span></button>
    <button class="switch active" data-style="modern" data-label="Clean Modern" aria-label="Clean Modern kitchen" aria-pressed="true"><span class="rocker"></span></button>
    <button class="switch" data-style="rustic" data-label="Slightly Rustic" aria-label="Slightly Rustic kitchen"><span class="rocker"></span></button>
  </div>
</main>

<script>
(function(){
  var SPRITE={w:1608,h:1532};
  var ART=[
    {title:'Beets',url:'https://fineartamerica.com/featured/beets-jayme-hunt.html',crop:{x:36,y:305,w:274,h:250}},
    {title:'Pears',url:'https://fineartamerica.com/featured/pears-jayme-hunt.html',crop:{x:342,y:305,w:275,h:250}},
    {title:'Artichoke',url:'https://fineartamerica.com/featured/artichoke-jayme-hunt.html',crop:{x:648,y:305,w:280,h:250}},
    {title:'Avocado',url:'https://fineartamerica.com/featured/avocado-jayme-hunt.html',crop:{x:958,y:305,w:280,h:250}}
  ];
  var frames=[].slice.call(document.querySelectorAll('.frame'));
  var cursor=0;
  function paint(frame,item){
    var c=item.crop, art=frame.querySelector('.art');
    var sx=(SPRITE.w/c.w)*100, sy=(SPRITE.h/c.h)*100;
    var px=(c.x/(SPRITE.w-c.w))*100, py=(c.y/(SPRITE.h-c.h))*100;
    art.style.backgroundSize=sx+'% '+sy+'%';
    art.style.backgroundPosition=px+'% '+py+'%';
    frame.href=item.url;
    frame.setAttribute('aria-label',item.title+' by Jayme Hunt — open purchase page');
    frame.title=item.title;
  }
  function refresh(){
    frames.forEach(function(frame,i){
      frame.classList.add('changing');
      var item=ART[(cursor+i)%ART.length];
      setTimeout(function(){paint(frame,item);frame.classList.remove('changing')},260);
    });
    cursor=(cursor+1)%ART.length;
  }
  frames.forEach(function(frame,i){paint(frame,ART[i%ART.length])});
  var timer=setInterval(refresh,6200);
  frames.forEach(function(frame){
    frame.addEventListener('mouseenter',function(){clearInterval(timer)});
    frame.addEventListener('mouseleave',function(){timer=setInterval(refresh,6200)});
    frame.addEventListener('focus',function(){clearInterval(timer)});
    frame.addEventListener('blur',function(){timer=setInterval(refresh,6200)});
  });

  var switches=[].slice.call(document.querySelectorAll('.switch'));
  switches.forEach(function(btn){
    btn.addEventListener('click',function(){
      switches.forEach(function(b){b.classList.remove('active','show-label');b.setAttribute('aria-pressed','false')});
      btn.classList.add('active','show-label');
      btn.setAttribute('aria-pressed','true');
      document.body.setAttribute('data-style',btn.getAttribute('data-style'));
      setTimeout(function(){btn.classList.remove('show-label')},1100);
    });
  });
})();
</script>
</body>
</html>
