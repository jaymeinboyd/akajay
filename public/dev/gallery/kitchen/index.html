<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>akaJay — Kitchen gallery beta</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151617;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{color:#f5f0e8}
.back{
  position:fixed;left:18px;top:16px;z-index:60;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;color:#eee;font-size:1.35rem;
  border:1px solid rgba(255,255,255,.35);background:rgba(20,22,23,.58);backdrop-filter:blur(8px)
}
.room-shell{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:
  radial-gradient(ellipse at 50% 15%,#323536,#171819 68%,#101112)}
.stage{
  position:relative;
  width:min(100vw,calc(100vh * 1.333333));
  height:min(100vh,calc(100vw * .75));
  aspect-ratio:4/3;
  background-image:url("../assets/kitchens-sprite.webp");
  background-repeat:no-repeat;
  background-size:300% 200%;
  background-position:0% 0%;
  box-shadow:0 0 50px rgba(0,0,0,.42);
  transition:opacity .25s ease;
}
.stage.changing{opacity:.14}
.art-link{
  position:absolute;display:block;z-index:10;overflow:hidden;
  background:#f3efe5;text-decoration:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.04);
  transition:filter .16s ease,box-shadow .16s ease,transform .16s ease,opacity .28s ease;
  transform-origin:center;
}
.art-link:hover,.art-link:focus-visible{
  filter:brightness(1.055);box-shadow:0 0 0 3px rgba(255,255,255,.55),0 8px 18px rgba(0,0,0,.25);
  outline:none;z-index:14
}
.art-link.changing{opacity:.08}
.art{display:block;width:100%;height:100%;background-image:url("../assets/art-sprite.png");background-repeat:no-repeat;background-color:#fff}
.switch-plate{
  position:absolute;left:50%;bottom:2.8%;transform:translateX(-50%);z-index:30;
  width:292px;height:78px;border-radius:8px;padding:10px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:7px;
  background:linear-gradient(145deg,#faf9f5,#c9c9c4);
  border:1px solid rgba(55,52,48,.62);
  box-shadow:0 10px 24px rgba(0,0,0,.46),inset 1px 1px rgba(255,255,255,.9);
}
.switch-plate::before,.switch-plate::after{content:"";position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#777 45%,#333);transform:translateY(-50%)}
.switch-plate::before{left:6px}.switch-plate::after{right:6px}
.switch{
  position:relative;width:34px;height:54px;padding:0;border:0;background:transparent;cursor:pointer
}
.rocker{
  position:absolute;left:6px;right:6px;top:5px;bottom:5px;border-radius:3px;
  background:linear-gradient(180deg,#fff,#ecebe6);border:1px solid rgba(40,40,36,.32);
  box-shadow:inset 0 -7px 8px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.3);
  transform:perspective(80px) rotateX(-8deg);transition:transform .2s ease,box-shadow .2s ease
}
.switch.active .rocker{transform:perspective(80px) rotateX(13deg) translateY(-2px);box-shadow:inset 0 8px 8px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.2)}
.switch::after{
  content:attr(data-label);position:absolute;left:50%;bottom:68px;transform:translateX(-50%) translateY(5px);
  white-space:nowrap;padding:7px 10px;border-radius:4px;color:#f5f0e8;background:rgba(24,25,25,.94);
  font-size:.72rem;letter-spacing:.035em;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;
  box-shadow:0 5px 12px rgba(0,0,0,.35)
}
.switch:hover::after,.switch:focus-visible::after,.switch.show-label::after{opacity:1;transform:translateX(-50%) translateY(0)}
.switch:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:3px}
.welcome{
  position:absolute;left:50%;bottom:14%;z-index:45;transform:translateX(-50%);
  width:min(560px,82%);padding:16px 22px;border-radius:8px;text-align:center;
  background:rgba(24,25,25,.86);color:#f6f0e7;backdrop-filter:blur(7px);
  box-shadow:0 12px 28px rgba(0,0,0,.36);
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(1rem,2.2vw,1.35rem);line-height:1.45;
  opacity:1;transition:opacity .65s ease,transform .65s ease
}
.welcome.hide{opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none}
.switch-plate.guide{animation:guideGlow 1.05s ease-in-out 3}
@keyframes guideGlow{
  0%,100%{box-shadow:0 10px 24px rgba(0,0,0,.46),inset 1px 1px rgba(255,255,255,.9)}
  50%{box-shadow:0 0 0 5px rgba(235,206,137,.42),0 12px 28px rgba(0,0,0,.48),inset 1px 1px rgba(255,255,255,.9)}
}
@media(max-width:700px){
  .switch-plate{width:276px;height:72px;bottom:2%}
  .switch{width:32px;height:50px}
  .welcome{bottom:13%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to room entrance">←</a>
<main class="room-shell" aria-label="Kitchen gallery">
  <div class="stage" id="stage">
    <a class="art-link" data-slot="0" target="_blank" rel="noopener"><span class="art"></span></a>
    <a class="art-link" data-slot="1" target="_blank" rel="noopener"><span class="art"></span></a>
    <a class="art-link" data-slot="2" target="_blank" rel="noopener"><span class="art"></span></a>

    <div class="welcome" id="welcome">Welcome — choose your kitchen style using the light switches.</div>

    <div class="switch-plate guide" id="switchPlate" role="group" aria-label="Kitchen style">
      <button class="switch" data-style="airy" data-label="Bright & Airy" aria-label="Bright and Airy kitchen"><span class="rocker"></span></button>
      <button class="switch" data-style="farmhouse" data-label="Cozy Farmhouse" aria-label="Cozy Farmhouse kitchen"><span class="rocker"></span></button>
      <button class="switch" data-style="traditional" data-label="Classic Traditional" aria-label="Classic Traditional kitchen"><span class="rocker"></span></button>
      <button class="switch active" data-style="modern" data-label="Clean Modern" aria-label="Clean Modern kitchen" aria-pressed="true"><span class="rocker"></span></button>
      <button class="switch" data-style="rustic" data-label="Slightly Rustic" aria-label="Slightly Rustic kitchen"><span class="rocker"></span></button>
      <button class="switch" data-style="grandma" data-label="Grandma-core" aria-label="Grandma-core kitchen"><span class="rocker"></span></button>
    </div>
  </div>
</main>
<script>
(function(){
  var SPRITE={w:1608,h:1532};
  var ART=[
    {title:'Beets',url:'https://fineartamerica.com/featured/beets-jayme-hunt.html',crop:{x:36,y:305,w:274,h:250}},
    {title:'Pears',url:'https://fineartamerica.com/featured/pears-jayme-hunt.html',crop:{x:342,y:305,w:275,h:250}},
    {title:'Artichoke',url:'https://fineartamerica.com/featured/artichoke-jayme-hunt.html',crop:{x:648,y:305,w:280,h:250}},
    {title:'Avocado',url:'https://fineartamerica.com/featured/avocado-jayme-hunt.html',crop:{x:958,y:305,w:280,h:250}}
  ];

  var SCENES={
    modern:{
      bg:'0% 0%',
      frames:[
        {l:10.7,t:17.0,w:13.5,h:25.2},
        {l:40.1,t:14.0,w:17.6,h:27.5},
        {l:69.7,t:17.0,w:13.6,h:25.1}
      ]
    },
    airy:{
      bg:'50% 0%',
      frames:[
        {l:27.5,t:24.6,w:12.5,h:25.0},
        {l:44.3,t:19.4,w:16.2,h:30.4},
        {l:63.0,t:22.8,w:13.4,h:26.0}
      ]
    },
    traditional:{
      bg:'100% 0%',
      frames:[
        {l:24.2,t:20.7,w:14.7,h:27.8},
        {l:45.6,t:20.5,w:15.8,h:28.3},
        {l:68.2,t:20.6,w:14.8,h:27.8}
      ]
    },
    rustic:{
      bg:'0% 100%',
      frames:[
        {l:20.5,t:18.0,w:15.6,h:30.0},
        {l:43.2,t:14.1,w:18.0,h:34.0},
        {l:69.2,t:11.4,w:20.0,h:36.0}
      ]
    },
    farmhouse:{
      bg:'50% 100%',
      frames:[
        {l:20.0,t:18.0,w:15.1,h:27.0},
        {l:42.7,t:18.5,w:15.1,h:27.0},
        {l:65.2,t:19.3,w:13.8,h:25.5}
      ]
    },
    grandma:{
      bg:'100% 100%',
      frames:[
        {l:26.2,t:28.8,w:4.8,h:13.5},
        {l:40.5,t:22.0,w:6.2,h:16.0},
        {l:77.0,t:18.0,w:9.4,h:22.4}
      ]
    }
  };

  var stage=document.getElementById('stage');
  var frames=[].slice.call(document.querySelectorAll('.art-link'));
  var switches=[].slice.call(document.querySelectorAll('.switch'));
  var currentStyle='modern',cursor=0,timer;

  function paintArt(frame,item){
    var c=item.crop, art=frame.querySelector('.art');
    var sx=(SPRITE.w/c.w)*100, sy=(SPRITE.h/c.h)*100;
    var px=(c.x/(SPRITE.w-c.w))*100, py=(c.y/(SPRITE.h-c.h))*100;
    art.style.backgroundSize=sx+'% '+sy+'%';
    art.style.backgroundPosition=px+'% '+py+'%';
    frame.href=item.url;
    frame.setAttribute('aria-label',item.title+' by Jayme Hunt — open purchase page');
    frame.title=item.title;
  }

  function positionFrames(style){
    var defs=SCENES[style].frames;
    frames.forEach(function(frame,i){
      var d=defs[i];
      frame.style.left=d.l+'%';frame.style.top=d.t+'%';frame.style.width=d.w+'%';frame.style.height=d.h+'%';
    });
  }

  function setScene(style){
    currentStyle=style;
    stage.classList.add('changing');
    setTimeout(function(){
      stage.style.backgroundPosition=SCENES[style].bg;
      positionFrames(style);
      stage.classList.remove('changing');
    },190);
  }

  function refresh(){
    frames.forEach(function(frame,i){
      frame.classList.add('changing');
      var item=ART[(cursor+i)%ART.length];
      setTimeout(function(){paintArt(frame,item);frame.classList.remove('changing')},240);
    });
    cursor=(cursor+1)%ART.length;
  }

  frames.forEach(function(frame,i){paintArt(frame,ART[i%ART.length])});
  positionFrames('modern');
  timer=setInterval(refresh,6200);
  frames.forEach(function(frame){
    frame.addEventListener('mouseenter',function(){clearInterval(timer)});
    frame.addEventListener('mouseleave',function(){timer=setInterval(refresh,6200)});
    frame.addEventListener('focus',function(){clearInterval(timer)});
    frame.addEventListener('blur',function(){timer=setInterval(refresh,6200)});
  });

  switches.forEach(function(btn){
    btn.addEventListener('click',function(){
      switches.forEach(function(b){b.classList.remove('active','show-label');b.setAttribute('aria-pressed','false')});
      btn.classList.add('active','show-label');btn.setAttribute('aria-pressed','true');
      setScene(btn.getAttribute('data-style'));
      document.getElementById('welcome').classList.add('hide');
      document.getElementById('switchPlate').classList.remove('guide');
      setTimeout(function(){btn.classList.remove('show-label')},1000);
    });
  });

  setTimeout(function(){document.getElementById('welcome').classList.add('hide')},4700);
})();
</script>
</body>
</html>
