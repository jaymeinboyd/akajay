<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>akaJay — Gallery entrance</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{
  min-height:100vh;overflow:hidden;color:#efe9df;
  background:
    linear-gradient(180deg,rgba(255,255,255,.12),transparent 20%),
    linear-gradient(90deg,#3b3f40,#2b2e2f 50%,#383c3d);
}
body::after{
  content:"";position:fixed;left:0;right:0;bottom:0;height:18vh;
  background:
    repeating-linear-gradient(92deg,rgba(255,255,255,.03) 0 2px,transparent 2px 78px),
    linear-gradient(180deg,#292725,#171716);
  border-top:1px solid rgba(255,255,255,.13);z-index:0;
}
.back{
  position:fixed;left:24px;top:20px;z-index:50;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;color:#f4efe6;font-size:1.4rem;
  border:1px solid rgba(255,255,255,.28);background:rgba(18,20,20,.58);backdrop-filter:blur(8px)
}
.foyer{position:relative;width:100vw;height:100vh;perspective:1800px;z-index:1}
.wall-panel{
  position:absolute;left:50%;top:0;bottom:18vh;width:min(760px,86vw);transform:translateX(-50%);
  background:
    radial-gradient(ellipse at 50% 8%,rgba(255,255,255,.15),transparent 55%),
    linear-gradient(180deg,#484c4d,#303334);
  box-shadow:inset 1px 0 rgba(255,255,255,.06),inset -1px 0 rgba(0,0,0,.25);
}
.selector{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);
  width:min(900px,90vw);padding:30px;
  opacity:0;visibility:hidden;filter:blur(3px);
  transition:opacity .45s ease .62s,filter .45s ease .62s,visibility 0s linear .62s;
}
body.open .selector{opacity:1;visibility:visible;filter:none}
.selector h1{
  margin:0 0 22px;text-align:center;
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:400;
  letter-spacing:.02em;text-shadow:0 2px 7px rgba(0,0,0,.45)
}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.room{
  min-height:205px;position:relative;overflow:hidden;text-decoration:none;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(145deg,#292b2c,#1b1d1e);
  box-shadow:0 13px 28px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.08);
  color:#eee8de;
}
.room::before{
  content:"";position:absolute;left:18%;right:18%;top:16px;bottom:50px;
  border:10px solid #49433d;background:#d8d3c9;
  box-shadow:inset 0 0 0 9px #efebe2,0 7px 14px rgba(0,0,0,.25);
}
.room::after{
  content:"";position:absolute;left:50%;bottom:20px;width:110px;height:26px;transform:translateX(-50%);
  border-radius:2px;background:linear-gradient(180deg,#d5b977,#87672d 55%,#b99b59);
  border:1px solid #3d2e16;box-shadow:inset 0 1px rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.35);
}
.room span{
  position:absolute;left:0;right:0;bottom:23px;z-index:2;text-align:center;
  color:#201a11;font-family:Georgia,"Times New Roman",serif;font-size:1rem;
}
.room.active::before{
  background:
    linear-gradient(90deg,transparent 0 10%,rgba(214,221,219,.7) 10% 12%,transparent 12% 71%,#c7a670 71% 75%,transparent 75%),
    linear-gradient(180deg,#fbfaf5 0 58%,#dbd9d1 58% 61%,#a28969 61% 65%,#ece9e1 65%);
}
.room.active{transition:transform .18s ease,box-shadow .18s ease}
.room.active:hover,.room.active:focus-visible{
  transform:translateY(-4px);box-shadow:0 20px 36px rgba(0,0,0,.4);outline:none
}
.room.quiet{opacity:.58}
.room.quiet::before{background:#e8e3da}
.door-wrap{
  position:absolute;left:50%;top:50%;width:min(410px,48vw);height:min(650px,74vh);
  transform:translate(-50%,-52%);transform-style:preserve-3d;z-index:20;
  transition:opacity .38s ease .68s,transform .45s ease .68s,visibility 0s linear 1.05s;
}
body.open .door-wrap{
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-52%) scale(1.04)
}
.trim{
  position:absolute;inset:-30px -34px -14px;border:22px solid #171819;
  border-bottom-width:14px;
  background:transparent;
  box-shadow:0 22px 45px rgba(0,0,0,.38),inset 0 0 0 2px rgba(255,255,255,.08);
}
.threshold{position:absolute;left:-46px;right:-46px;bottom:-20px;height:15px;background:linear-gradient(180deg,#766a5b,#302b25);box-shadow:0 5px 9px rgba(0,0,0,.4)}
.door{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .92s cubic-bezier(.2,.75,.15,1);
  background:
    linear-gradient(90deg,rgba(255,255,255,.06),transparent 15% 83%,rgba(0,0,0,.18)),
    repeating-linear-gradient(90deg,#533829 0 22px,#493025 22px 44px,#583a2a 44px 66px);
  border:1px solid #17120f;box-shadow:inset 0 0 45px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.34)
}
body.open .door{transform:rotateY(-82deg)}
.door::before,.door::after{
  content:"";position:absolute;left:46px;right:46px;border:8px ridge rgba(42,26,18,.62);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.035)
}
.door::before{top:55px;height:32%}.door::after{bottom:55px;height:37%}
.plaque{
  position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  padding:9px 22px;background:linear-gradient(180deg,#ddc27f,#88672e 54%,#ccb06c);
  color:#261d10;border:1px solid #3b2b12;font-family:Georgia,"Times New Roman",serif;
  font-size:1rem;letter-spacing:.15em;text-transform:uppercase;box-shadow:inset 0 1px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.45)
}
.handle-button{position:absolute;right:22px;top:50%;width:92px;height:92px;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;z-index:5}
.handle-plate{position:absolute;right:25px;top:20px;width:34px;height:54px;border-radius:5px;border:1px solid #343738;background:linear-gradient(90deg,#5a5e5f,#eef0ef 22%,#55595a 50%,#fafbfa 75%,#4a4e4f);box-shadow:inset 1px 0 #fff,0 2px 7px rgba(0,0,0,.55)}
.handle{position:absolute;right:-1px;top:40px;width:58px;height:13px;border-radius:12px;transform-origin:8px 50%;background:linear-gradient(180deg,#fff,#8d9192 25%,#292b2c 48%,#f0f2f1 67%,#686c6d);box-shadow:0 3px 4px rgba(0,0,0,.55);transition:transform .28s ease}
.handle-button.turn .handle{transform:rotate(34deg)}
@media(max-width:700px){
  .selector{padding:18px}.rooms{gap:10px}.room{min-height:165px}.room span{font-size:.9rem}
  .door-wrap{width:300px;height:500px}.wall-panel{width:94vw}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to akaJay">←</a>
<main class="foyer">
  <div class="wall-panel" aria-hidden="true"></div>
  <section class="selector" aria-label="Choose a room">
    <h1>Choose a room</h1>
    <div class="rooms">
      <a class="room active" href="./kitchen/" aria-label="Enter Kitchen"><span>Kitchen</span></a>
      <div class="room quiet" aria-disabled="true"><span>Living Room</span></div>
      <div class="room quiet" aria-disabled="true"><span>Bathroom</span></div>
      <div class="room quiet" aria-disabled="true"><span>Bedroom</span></div>
    </div>
  </section>
  <div class="door-wrap" aria-label="Gallery door">
    <div class="trim" aria-hidden="true"></div><div class="threshold" aria-hidden="true"></div>
    <div class="door">
      <div class="plaque" aria-hidden="true">Gallery</div>
      <button class="handle-button" id="handleButton" aria-label="Open gallery door" aria-expanded="false">
        <span class="handle-plate" aria-hidden="true"></span><span class="handle" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</main>
<script>
(function(){
  var btn=document.getElementById('handleButton');
  btn.addEventListener('click',function(){
    btn.classList.add('turn');
    setTimeout(function(){
      document.body.classList.add('open');
      btn.setAttribute('aria-expanded','true');
    },220);
  });
})();
</script>
</body>
</html>
