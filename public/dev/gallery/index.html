<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>akaJay — Gallery entrance</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark;--steel:#242728;--cream:#eee8de;--oak:#c9a36f;--chrome:#dfe3e3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#202324;color:var(--cream)}
body{
  min-height:100vh;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:
    radial-gradient(ellipse 70% 46% at 20% 4%,rgba(255,255,255,.17),transparent 62%),
    linear-gradient(110deg,transparent 0 20%,rgba(255,255,255,.075) 29%,transparent 43%),
    linear-gradient(180deg,#35393b,#252829 52%,#1e2021);
}
a{color:inherit}
.back{
  position:fixed;left:22px;top:18px;z-index:20;
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,22,23,.55);backdrop-filter:blur(8px);
  font-size:1.35rem;
}
.foyer{
  position:relative;
  width:min(1160px,94vw);
  height:min(720px,88vh);
  perspective:1600px;
}
.portal{
  position:absolute;inset:0;
  display:grid;place-items:center;
}
.selector{
  position:absolute;
  width:min(780px,76vw);
  min-height:520px;
  left:50%;top:50%;transform:translate(-50%,-50%);
  padding:42px;
  border:1px solid #151718;
  background:
    linear-gradient(rgba(255,255,255,.035),rgba(255,255,255,0) 18%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 72px),
    linear-gradient(180deg,#4a4d4e,#303334);
  box-shadow:0 35px 80px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.2);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  opacity:.18;
  transition:opacity .65s ease .25s,filter .65s ease .25s;
  filter:blur(3px);
}
body.open .selector{opacity:1;filter:none}
.room{
  min-height:205px;
  position:relative;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(145deg,#eee9df,#cfc6b8);
  color:#242220;
  text-decoration:none;
  overflow:hidden;
  box-shadow:inset 0 0 0 8px rgba(35,31,27,.12),0 8px 18px rgba(0,0,0,.22);
}
.room::before{
  content:"";
  position:absolute;inset:20px 24px 58px;
  border:10px solid #403a34;
  background:#f8f5ed;
  box-shadow:inset 0 0 0 8px #ece4d6;
}
.room::after{
  content:"";
  position:absolute;left:25%;right:25%;bottom:28px;height:8px;
  border-radius:10px;
  background:linear-gradient(180deg,#fff,#8c9192 46%,#272a2b 53%,#dfe2e2);
  box-shadow:0 2px 4px rgba(0,0,0,.45);
}
.room span{
  position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-family:Georgia,"Times New Roman",serif;font-size:1.12rem;letter-spacing:.035em;
}
.room.active{
  background:
    radial-gradient(circle at 75% 22%,rgba(255,255,255,.8),transparent 24%),
    linear-gradient(145deg,#f5f2eb,#d8cbbb);
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}
.room.active::before{
  border-color:#262a2b;
  background:
    linear-gradient(90deg,transparent 0 9%,#dfe4e2 9% 11%,transparent 11% 72%,#c3a271 72% 75%,transparent 75%),
    linear-gradient(180deg,#f8f8f5 0 58%,#d1d2ce 58% 62%,#9d815f 62% 66%,#e8e6df 66%);
}
.room.active:hover,.room.active:focus-visible{
  transform:translateY(-4px);
  box-shadow:inset 0 0 0 8px rgba(35,31,27,.12),0 16px 30px rgba(0,0,0,.33);
  outline:none;
}
.room.quiet{opacity:.58;filter:saturate(.35)}
.room.quiet::before{
  background:
    linear-gradient(135deg,transparent 0 48%,rgba(0,0,0,.04) 49% 51%,transparent 52%),
    #f3eee5;
}
.door-wrap{
  width:390px;height:650px;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
  transition:transform .7s ease;
  z-index:5;
}
.door-frame{
  position:absolute;inset:-18px;
  border:18px solid #171819;
  box-shadow:0 28px 60px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.12);
}
.door{
  position:absolute;inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.2,.75,.15,1);
  background:
    linear-gradient(90deg,rgba(255,255,255,.05),transparent 16% 83%,rgba(0,0,0,.2)),
    repeating-linear-gradient(90deg,#4d3326 0 18px,#503628 18px 36px,#472e22 36px 54px);
  border:1px solid #17120f;
  box-shadow:inset 0 0 45px rgba(0,0,0,.25),0 15px 35px rgba(0,0,0,.42);
}
body.open .door{transform:rotateY(-82deg)}
.door::before,.door::after{
  content:"";position:absolute;left:40px;right:40px;border:8px ridge rgba(36,23,16,.62);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.035);
}
.door::before{top:55px;height:205px}
.door::after{bottom:55px;height:270px}
.plaque{
  position:absolute;left:50%;top:285px;transform:translateX(-50%);
  padding:8px 20px;border-radius:2px;
  background:linear-gradient(180deg,#d8bc7d,#87662c 52%,#ceb06b);
  color:#271e10;border:1px solid #3b2b12;
  font-family:Georgia,"Times New Roman",serif;font-size:1rem;letter-spacing:.13em;text-transform:uppercase;
  box-shadow:inset 0 1px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.45);
}
.handle-button{
  position:absolute;right:30px;top:50%;width:78px;height:78px;
  transform:translateY(-50%);border:0;background:transparent;cursor:pointer;z-index:3;
}
.handle-plate{
  position:absolute;inset:13px 22px;border-radius:5px;
  border:1px solid #343738;
  background:linear-gradient(90deg,#606465,#e9eceb 21%,#55595a 49%,#f6f7f6 76%,#4c5051);
  box-shadow:inset 1px 0 #fff,0 2px 7px rgba(0,0,0,.55);
}
.handle{
  position:absolute;left:31px;top:32px;width:48px;height:12px;
  border-radius:12px;transform-origin:5px 50%;
  background:linear-gradient(180deg,#fff,#8d9192 25%,#292b2c 48%,#f0f2f1 67%,#686c6d);
  box-shadow:0 3px 4px rgba(0,0,0,.55);
  transition:transform .32s ease;
}
.handle-button.turn .handle{transform:rotate(34deg)}
.hinge{position:absolute;left:-8px;width:13px;height:65px;background:linear-gradient(90deg,#2a2c2d,#cfd2d1,#444748);z-index:7}
.h1{top:90px}.h2{bottom:90px}
@media(max-width:720px){
  .foyer{width:100vw;height:100vh}
  .door-wrap{width:270px;height:470px}
  .selector{width:92vw;min-height:70vh;padding:18px;gap:10px}
  .room{min-height:155px}.room span{font-size:.94rem}
  .plaque{top:200px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to akaJay">←</a>
<main class="foyer" aria-label="Gallery entrance">
  <div class="portal">
    <section class="selector" aria-label="Choose a room">
      <a class="room active" href="./kitchen/" aria-label="Enter Kitchen"><span>Kitchen</span></a>
      <div class="room quiet" aria-disabled="true"><span>Living Room</span></div>
      <div class="room quiet" aria-disabled="true"><span>Bathroom</span></div>
      <div class="room quiet" aria-disabled="true"><span>Bedroom</span></div>
    </section>
    <div class="door-wrap">
      <div class="door-frame" aria-hidden="true"></div>
      <div class="door" id="door">
        <span class="hinge h1" aria-hidden="true"></span><span class="hinge h2" aria-hidden="true"></span>
        <div class="plaque" aria-hidden="true">Gallery</div>
        <button class="handle-button" id="handleButton" aria-label="Open gallery door" aria-expanded="false">
          <span class="handle-plate" aria-hidden="true"></span><span class="handle" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</main>
<script>
(function(){
  var btn=document.getElementById('handleButton');
  btn.addEventListener('click',function(){
    btn.classList.add('turn');
    setTimeout(function(){
      document.body.classList.toggle('open');
      btn.setAttribute('aria-expanded',document.body.classList.contains('open')?'true':'false');
      setTimeout(function(){btn.classList.remove('turn')},420);
    },260);
  });
})();
</script>
</body>
</html>
